server:
  port: 9009
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: modu-square-push-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # rewriteBatchedStatements: JdbcTemplate batch insert를 한 번의 다중 행 INSERT로 보낸다.
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/push?rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: modu-square-push-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

push:
  provider:
    url: ${PUSH_PROVIDER_URL:http://127.0.0.1:9010}
    connect-timeout: 1s
    read-timeout: 3s
  dispatch:
    interval: 1s
    page-size: 1000
  send:
    concurrency: 6
    # 발송 중(SENDING)으로 선점한 건을 다른 처리가 가져가지 못하게 막는 시간.
    # 업체 호출 한 번은 read-timeout(3초)을 넘지 않으므로, 이 시간이 지나도 SENDING이면 처리하던 인스턴스가 죽은 것으로 본다.
    lease: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      service: ${spring.application.name}
