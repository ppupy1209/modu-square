global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/auth-security-rules.yml

scrape_configs:
  - job_name: modu-square-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - article:9000
          - comment:9001
          - like:9002
          - view:9003
          - hot-article:9004
          - article-read:9005
          - notification:9006
          - media:9007
          - auth:9008

  # 공지 발송은 1~2분 안에 끝나 10초 간격으로는 변화가 뭉개진다. 발송 경로만 5초 간격으로 수집한다.
  - job_name: modu-square-push
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [push:9009]

  - job_name: push-provider
    scrape_interval: 5s
    static_configs:
      - targets: [push-provider:8080]

  - job_name: modu-square-mysql
    static_configs:
      - targets: [mysql-exporter:9104]

  - job_name: modu-square-redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: modu-square-kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

# k6 부하 테스트 결과는 scrape가 아니라 remote write로 유입된다.
# prometheus 컨테이너는 --web.enable-remote-write-receiver 로 기동되며,
# k6는 experimental-prometheus-rw output으로 http://prometheus:9090/api/v1/write 에 전송한다.
